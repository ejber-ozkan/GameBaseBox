name: Quality Gates

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'platform-manifest.json'
      - '*config*'
      - 'tsconfig.json'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'scripts/exportMdb.ps1'
              - 'platform-manifest.json'
              - '.github/workflows/quality.yml'

  # Lint, types, unit tests, audit, build and browser tests. Needs no GTK/WebKit
  # system packages, so it never waits on apt.
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Application and test types
        run: npm run typecheck
      - name: Frontend tests and coverage ratchet
        run: npm run coverage:frontend
      - name: Dependency audit
        run: npm audit --omit=dev
      - name: Production build smoke test
        run: npm run build
      # Full browser suite on pull requests, main and manual runs; branch pushes
      # get the fast checks above. Uses the runner's preinstalled Google Chrome
      # (channel: 'chrome' on CI in playwright.config.ts), so nothing is downloaded.
      - name: Browser smoke tests
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: npm run test:e2e

  # Rust formatting, lints and tests. Runs when the backend changed, and always on
  # pull requests, main and manual runs.
  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # The crate lives in src-tauri/, not the repository root.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # GTK/WebKit build dependencies. Downloaded .debs are kept in the Actions cache,
      # so later runs barely touch the Ubuntu mirror (a slow mirror once stalled the job
      # for 30 minutes). Retries plus one refresh-and-retry cover mirrors serving a
      # stale index (404s); a failed install still fails the job.
      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-tauri-v1
      - name: Install system dependencies
        timeout-minutes: 12
        run: |
          mkdir -p ~/apt-archives/partial
          apt_get() {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Dir::Cache::Archives="$HOME/apt-archives" "$@"
          }
          packages="libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev"
          apt_get update
          if ! apt_get install -y --no-install-recommends $packages; then
            echo "::warning::apt install failed; refreshing package lists and retrying"
            sleep 15
            apt_get update
            apt_get install -y --no-install-recommends --fix-missing $packages
          fi
          sudo rm -f ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
