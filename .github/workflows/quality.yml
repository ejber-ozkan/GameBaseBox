name: Quality Gates

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'platform-manifest.json'
      - '*config*'
      - 'tsconfig.json'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'scripts/exportMdb.ps1'
              - 'platform-manifest.json'
              - '.github/workflows/quality.yml'

  # Lint, types, unit tests, audit, build and browser tests. Needs no GTK/WebKit
  # system packages, so it never waits on apt.
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Application and test types
        run: npm run typecheck
      - name: Frontend tests and coverage ratchet
        run: npm run coverage:frontend
      - name: Dependency audit
        run: npm audit --omit=dev
      - name: Production build smoke test
        run: npm run build
      # Full browser suite on pull requests, main and manual runs; branch pushes
      # get the fast checks above. Uses the runner's preinstalled Google Chrome
      # (channel: 'chrome' on CI in playwright.config.ts), so nothing is downloaded.
      - name: Browser smoke tests
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: npm run test:e2e

  # Rust formatting, lints and tests. Runs when the backend changed, and always on
  # pull requests, main and manual runs.
  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # The crate lives in src-tauri/, not the repository root.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # GTK/WebKit build dependencies (~170 .debs, ~60 MB). The Azure Ubuntu mirror
      # answers package downloads slowly (about 2 s each, large files can stall), so
      # apt alone has taken 12-30 minutes. Instead the missing .debs are fetched 16 at
      # a time, a transfer that stalls falls back to archive.ubuntu.com, and apt then
      # installs from the local files. Downloaded .debs are kept in the Actions cache,
      # so later runs download nothing.
      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-tauri-v1
      - name: Install system dependencies
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p ~/apt-archives/partial
          apt_get() {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Dir::Cache::Archives="$HOME/apt-archives" "$@"
          }
          packages="libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev"
          apt_get update -qq
          # Lists only the .debs not already in ~/apt-archives: 'url' file size hash
          apt_get install -qq --print-uris --no-install-recommends $packages \
            | grep "^'" | tr -d "'" | cut -d' ' -f1,2 > ~/apt-uris.txt || true
          echo "$(wc -l < ~/apt-uris.txt) packages to download"
          fetch() {
            local url=$1 file=$2
            for source in "$url" "${url/azure.archive.ubuntu.com/archive.ubuntu.com}"; do
              if curl -fsSL --retry 1 --connect-timeout 10 --speed-limit 50000 --speed-time 15 \
                  -o "$HOME/apt-archives/partial/$file" "$source"; then
                mv "$HOME/apt-archives/partial/$file" "$HOME/apt-archives/$file"
                return 0
              fi
            done
            echo "::warning::could not download $file; apt will retry it"
          }
          export -f fetch
          xargs -P 16 -L 1 bash -c 'fetch "$0" "$1"' < ~/apt-uris.txt
          # apt checks every hash and downloads anything still missing itself.
          apt_get install -y --no-install-recommends $packages
          sudo rm -f ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
