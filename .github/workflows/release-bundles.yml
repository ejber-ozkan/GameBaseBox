name: Release Bundles

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows bundles
        required: false
        type: boolean
        default: false
      build_linux:
        description: Build Linux bundles
        required: false
        type: boolean
        default: true
      build_macos:
        description: Build macOS bundles
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-bundles-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate all version sources and optional tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" = push ]; then
            node scripts/release-safety.mjs versions "$RELEASE_TAG"
          else
            node scripts/release-safety.mjs versions
          fi

  quality:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install dependencies
        run: npm ci
      - name: Run required quality gates
        run: |
          npm run lint
          npm run test:frontend
          npm run test:backend
          npm audit --omit=dev
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  draft:
    needs: [validate, quality]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          notes="RELEASE_NOTES_${version}.md"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json", "utf8")).isDraft) throw new Error("Refusing to modify a published release")'
            gh release edit "$RELEASE_TAG" --draft --title "GBBox ${version}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "GBBox ${version}" --notes-file "$notes"
          fi

  build-windows:
    needs: [validate, quality]
    if: github.event_name == 'push' || github.event.inputs.build_windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npx tauri build

      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          Copy-Item $installer.FullName "release-assets/GBBox-Windows-x64-Setup.exe"
          node scripts/release-safety.mjs checksum release-assets windows

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: gbbox-windows-bundles
          path: release-assets/**
          if-no-files-found: error

  build-linux:
    needs: [validate, quality]
    if: github.event_name == 'push' || github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npx tauri build

      - name: Prepare Linux release asset
        run: |
          mkdir -p release-assets
          installer="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n 1)"
          if [ -z "$installer" ]; then
            echo "Linux AppImage not found" >&2
            exit 1
          fi
          cp "$installer" release-assets/GBBox-Linux.AppImage
          node scripts/release-safety.mjs checksum release-assets linux

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: gbbox-linux-bundles
          path: release-assets/**
          if-no-files-found: error

  build-macos:
    needs: [validate, quality]
    if: github.event_name == 'push' || github.event.inputs.build_macos == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npx tauri build

      - name: Prepare macOS release asset
        run: |
          mkdir -p release-assets
          installer="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -n 1)"
          if [ -z "$installer" ]; then
            echo "macOS DMG not found" >&2
            exit 1
          fi
          cp "$installer" release-assets/GBBox-macOS.dmg
          node scripts/release-safety.mjs checksum release-assets macos

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: gbbox-macos-bundles
          path: release-assets/**
          if-no-files-found: error

  verify-bundles:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: gbbox-*-bundles
          merge-multiple: true
          path: release-assets
      - name: Verify complete bundle set
        run: node scripts/release-safety.mjs verify release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: gbbox-verified-release
          path: release-assets/**
          if-no-files-found: error

  publish:
    needs: [validate, draft, build-windows, build-linux, build-macos, verify-bundles]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: gbbox-verified-release
          path: release-assets
      - name: Verify and publish complete draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-safety.mjs versions "$RELEASE_TAG"
          node scripts/release-safety.mjs verify release-assets
          gh release view "$RELEASE_TAG" --json isDraft > release-state.json
          node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json", "utf8")).isDraft) throw new Error("Refusing to modify a published release")'
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release download "$RELEASE_TAG" --dir release-check
          node scripts/release-safety.mjs verify release-check
          cmp release-assets/SHA256SUMS release-check/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
